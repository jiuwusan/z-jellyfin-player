<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>z-jellyfin · 播放器首次取流设计</title>
<link rel="icon" href="../app-icon.png"><link rel="stylesheet" href="large-type.css"><link rel="stylesheet" href="player-loading.css">
</head>
<body>
<div class="prepReview">
 <aside class="prepNotes" aria-label="播放器加载态评审">
  <h1>首次取流<span>横屏全屏 · 设计提案</span></h1>
  <p class="prepIntro">封面接住等待，首帧接替封面。<br>仅设计预览，不连接真实服务器。</p>
  <fieldset><legend>查看状态</legend>
   <button class="prepChoice" data-state="waiting">正常等待 <span>仅转圈</span></button>
   <button class="prepChoice" data-state="slow">加载较慢 <span>转圈＋提示</span></button>
   <button class="prepChoice" data-state="error">失败重试 <span>停止转圈</span></button>
  </fieldset>
  <fieldset><legend>重试结果（仅用于演示）</legend><div class="prepPair"><button data-outcome="success">成功</button><button data-outcome="error">仍失败</button></div></fieldset>
  <div class="prepActions"><button id="replay">演示等待过程</button><button id="first-frame">模拟首帧到达</button></div>
  <p class="prepNote" id="review-status" aria-live="polite"></p>
  <p class="prepRule">等待超过约 150 ms 才转圈；超过 6 秒显示较慢提示；仅收到首帧后移除封面，不用接口返回成功代替首帧。</p>
  <a class="jump" href="home-resume.html?screen=player">查看原播放器设计 <span>↗</span></a>
  <a class="jump" href="loading-preview.html">查看浏览页加载设计 <span>↗</span></a>
 </aside>
 <section class="prepStage" aria-label="横屏播放器加载态设计稿">
  <div class="prepVideo" aria-hidden="true"><span class="art" style="--x:0%;--y:0%"></span></div>
  <div class="prepCover" aria-hidden="true"><span class="art" style="--x:0%;--y:0%"></span><span class="prepShade"></span></div>
  <header class="prepHeader">
   <a class="prepBack" href="home-resume.html?screen=detail&item=detective" aria-label="返回剧集详情"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></a>
   <div class="prepTitle"><h2>魅影神捕</h2><p>第1季 · 第2集 · 月下疑踪</p></div>
   <div class="prepTools"><button data-ready-action="tracks" disabled aria-label="字幕，视频准备完成后可用"><span aria-hidden="true">CC</span> 字幕</button><button data-ready-action="tracks" disabled aria-label="音轨，视频准备完成后可用">♪ 音轨</button></div>
  </header>
  <div class="prepCenter" role="status" aria-live="polite" aria-atomic="true">
   <div class="prepWaiting"><span class="prepSpinner" aria-hidden="true"></span><span class="prepSr">正在准备视频，等待首帧</span><p class="prepSlow" hidden>视频准备较慢，请稍候</p></div>
   <div class="prepError" hidden><svg class="prepErrorIcon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13"/><path d="M16 8v10M16 23h.01"/></svg><h3>播放失败</h3><p>暂时无法播放，请重试。</p><div class="prepErrorActions"><button id="retry">重试播放</button><a href="home-resume.html?screen=detail&item=detective">返回</a></div></div>
  </div>
  <footer class="prepBottom" aria-label="播放控制，准备完成前不可用">
   <input id="prep-seek" type="range" min="0" max="2780" value="1961" aria-label="播放进度，准备完成后可调整" disabled>
   <div class="prepCounters"><span id="prep-time">32:41 / 46:20</span><span>1080p · 4 Mbps</span></div>
   <div class="prepTransport"><button data-ready-action="previous" disabled>‹ 上一集</button><button data-ready-action="backward" disabled>−5 秒</button><button class="prepToggle" data-ready-action="toggle" disabled aria-label="播放或暂停"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zM15 5h3v14h-3z"/></svg></button><button data-ready-action="forward" disabled>+15 秒</button><button data-ready-action="next" disabled>下一集 ›</button></div>
  </footer>
 </section>
</div>
<button id="prep-review-toggle" aria-expanded="false">预览状态</button>
<script src="player-loading.js"></script>
</body>
</html>
