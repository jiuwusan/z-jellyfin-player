<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jellyfin 家庭影音 · UI 设计</title>
<style>
:root{color-scheme:dark;--bg:#17131d;--panel:#241e2c;--lift:#312938;--text:#f8eef8;--sub:#c7b9cd;--dim:#9f8fa8;--accent:#dfc0ff;--mint:#a9d8cc;--line:#3d3244;--art:url("posters.png")}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 74% 16%,#34233e 0%,#1d1727 36%,#100e15 76%);color:var(--text);font-family:"Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;color:inherit;border:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:4px}
.desktop{max-width:1050px;margin:auto;min-height:100svh;display:grid;grid-template-columns:minmax(220px,1fr) 434px;gap:80px;align-items:center;padding:30px 74px}
.notes{max-width:330px}
.notes h1{font-size:clamp(34px,4.5vw,60px);line-height:1.04;letter-spacing:-.06em;margin:22px 0 18px;font-weight:760}
.jumps{display:grid;border-top:1px solid var(--line)}
.jump{display:flex;justify-content:space-between;text-align:left;padding:15px 0;border-bottom:1px solid var(--line);background:none;font-size:14px;color:var(--sub)}
.jump[aria-current="page"]{color:var(--accent);font-weight:700}
.shell{border:1px solid #55435f;border-radius:32px;box-shadow:0 19px 90px #09070cbf;overflow:hidden;background:var(--bg);height:min(890px,calc(100svh - 60px));min-height:636px;display:flex;flex-direction:column;isolation:isolate}
.top{height:66px;flex:0 0 66px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#19141feF;border-bottom:1px solid #2a2230}
.brand{display:flex;align-items:center;gap:10px;min-width:0;color:#f6edf9;font-weight:750;letter-spacing:-.03em;font-size:22px}
.toplabel{font-size:15px;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mark{width:29px;height:29px;border-radius:10px;background:#d7b4f6;position:relative;display:inline-block;flex-shrink:0}
.mark:before{content:"";position:absolute;left:10px;top:8px;border-left:10px solid #2b1939;border-top:6.5px solid transparent;border-bottom:6.5px solid transparent}
.tools,.actions{display:flex;gap:8px;align-items:center}
.icon{display:grid;place-items:center;min-width:43px;min-height:43px;border-radius:15px;background:#282030;color:#e8daf0;font-size:20px}
.icon.search:before{content:"";width:14px;height:14px;border:2px solid currentColor;border-radius:50%;transform:translate(-2px,-2px)}
.icon.search:after{content:"";position:absolute;width:7px;height:2px;background:currentColor;transform:translate(7px,7px) rotate(45deg);border-radius:2px}
.search{position:relative}
main{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#503e5c transparent}
main.pad{padding:18px 18px 24px}
.bottom{display:flex;justify-content:space-around;gap:8px;padding:8px 14px max(9px,env(safe-area-inset-bottom));background:#201927;border-top:1px solid #3c2e44}
.bottom button{display:grid;justify-items:center;gap:3px;min-width:92px;min-height:48px;background:transparent;border-radius:16px;color:var(--sub);font-size:12px}
.bottom span{display:grid;place-items:center;width:47px;height:24px;border-radius:20px;font-size:17px}
.bottom button[aria-current="page"]{color:var(--accent);font-weight:700}
.bottom button[aria-current="page"] span{background:#4a3557}
.group{margin:0 0 23px}
.group:last-child{margin-bottom:3px}
.section{display:flex;align-items:center;justify-content:space-between;margin:0 0 11px;gap:10px}
h2{font-size:19px;letter-spacing:-.025em;margin:0;font-weight:740}
.heroCover .shade{position:absolute;inset:0}
.cover,.heroCover{position:relative;overflow:hidden;isolation:isolate;background-color:#3a2b46}
.cover{display:block;border-radius:14px;aspect-ratio:2/3}
.cover.landscape{aspect-ratio:16/9}
.art{position:absolute;top:50%;left:0;width:100%;aspect-ratio:2/3;transform:translateY(-50%);background-image:var(--art);background-size:300% 200%;background-position:var(--x,0%) var(--y,0%);background-color:var(--fallback,#493953);pointer-events:none}
.a0{--x:0%;--y:0%;--fallback:#71444e}.a1{--x:50%;--y:0%;--fallback:#3d6c63}.a2{--x:100%;--y:0%;--fallback:#705136}.a3{--x:0%;--y:100%;--fallback:#334a69}.a4{--x:50%;--y:100%;--fallback:#924d4b}.a5{--x:100%;--y:100%;--fallback:#645073}
.cover .badge{position:absolute;bottom:11px;left:10px;border-radius:8px;background:#110d1edb;padding:5px 7px;font-size:10px;font-weight:700;color:#f9edf9}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:113px;gap:11px;overflow-x:auto;scrollbar-width:none;padding:0 2px 4px}
.rail:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.rail.resume,.rail.next-up{grid-auto-columns:165px}
.card{display:block;width:100%;padding:0;text-align:left;background:none;min-width:0;border-radius:15px}
.card:hover .cover{filter:brightness(1.12)}
.name{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:700;font-size:13px;line-height:1.38;margin:7px 0 2px}
.sub{display:block;color:var(--sub);font-size:11px;line-height:1.5}
.progress{display:block;height:5px;background:#564564;border-radius:9px;overflow:hidden}
.progress i{display:block;background:var(--accent);height:100%;border-radius:inherit}
.cover .progress{position:absolute;inset:auto 9px 7px;background:#776187}
.cover .resumeShade{position:absolute;inset:50% 0 0;background:linear-gradient(transparent,#120b1ae8)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px 11px}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 17px}
.chip{background:#281e30;border:1px solid #51405b;padding:7px 12px;border-radius:50px;color:var(--sub);font-size:12px;min-height:34px}
.chip[aria-pressed=true]{background:#523c63;color:#faedff;border-color:#765789}
.sheet{padding:20px 21px}
.heroCover{height:225px;background:#2d2236}
.heroCover .art{top:42%}
.heroCover .shade{background:linear-gradient(0deg,var(--bg) 1%,#17131d44 66%,transparent)}
.detail{position:relative;margin-top:-42px;background:none}
.detail h1{margin:0 0 6px;font-size:30px;line-height:1.18;letter-spacing:-.05em}
.meta{color:var(--sub);font-size:12px;margin:0 0 16px}
.summary{color:#e1d4e3;font-size:14px;line-height:1.7;margin:18px 0}
.primary,.secondary{display:inline-flex;justify-content:center;align-items:center;min-height:45px;padding:9px 15px;border-radius:13px;font-weight:700;font-size:13px}
.primary{background:var(--accent);color:#271731}
.secondary{background:#37283f;color:var(--text)}
.full{width:100%}
.watchprogress{margin:17px 0 5px}
.watchprogress+small{color:var(--sub);font-size:11px}
.seasonTabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding:4px 3px 8px;margin:0 -3px 5px}
.seasonTabs .chip{flex:0 0 auto;min-height:40px;padding:6px 16px;white-space:nowrap}
.seasonTabs .chip[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#271731;font-weight:700}
.episode{width:100%;padding:11px 0;display:flex;gap:11px;align-items:center;text-align:left;border-top:1px solid var(--line);background:none}
.episode .cover{width:78px;flex:0 0 78px;border-radius:9px}
.episode .name{margin-top:0}
.episodeInfo{flex:1;min-width:0}
.watched{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:5px 8px;background:#293f3b;color:var(--mint);font-size:11px;font-weight:700;white-space:nowrap}
.meta .watched{margin-left:8px;vertical-align:middle}
.settings form h2{font-size:16px;margin-bottom:14px}
.field{display:grid;gap:6px;margin:0 0 12px;color:var(--sub);font-size:12px}
.field:last-child{margin-bottom:0}
.field input,.field select,.searchField{width:100%;min-height:39px;border:1px solid #55435f;background:#1d1626;color:var(--text);border-radius:9px;padding:9px 11px;font-size:13px}
.columns{display:grid;grid-template-columns:minmax(0,1fr) 82px;gap:10px}
.qualityFields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qualityFields .field{margin-bottom:0}
.helper{color:var(--sub);font-size:12px;margin-top:12px;line-height:1.5;min-height:16px}
.confirmDialog{position:fixed;inset:50% auto auto var(--dialog-center,50%);transform:translate(-50%,-50%);margin:0;width:min(340px,calc(100vw - 36px));padding:20px;border:1px solid #594662;border-radius:21px;background:var(--panel);color:var(--text);box-shadow:0 22px 60px #0a070bc9}
.confirmDialog::backdrop{background:#0c0912b8}
.confirmDialog h2{margin-bottom:16px}
.confirmDialog .field{margin-bottom:0}
.confirmDialog .actions{justify-content:flex-end;margin-top:15px}
.confirmError{color:#ffbecb;margin:6px 0 0;font-size:12px;line-height:1.5}
.confirmError:empty{display:none}
.screenSearch{margin-bottom:17px}
.playerCover{margin-top:12px;border-radius:14px;aspect-ratio:16/9;height:auto}
.playerbar{display:flex;gap:10px;align-items:center;margin-top:15px}
.playerbar input{flex:1;min-width:50px;accent-color:var(--accent)}
.empty{color:var(--dim);font-size:13px;padding:12px 0}
@media(max-width:760px){body{background:var(--bg)}.desktop{display:block;padding:0}.notes{display:none}.shell{border:0;border-radius:0;height:100dvh;min-height:0;width:100%;box-shadow:none}.top{padding-top:env(safe-area-inset-top);height:calc(61px + env(safe-area-inset-top));flex-basis:calc(61px + env(safe-area-inset-top))}}
@media(prefers-reduced-motion:no-preference){button{transition:background-color .17s,filter .17s}.rail{scroll-behavior:smooth}}
</style>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="desktop">
 <aside class="notes" aria-label="原型导航">
  <h1>Jellyfin<br>家庭影音</h1>
  <nav class="jumps" aria-label="直接查看页面">
   <button class="jump" data-jump="home">首页 <span aria-hidden="true">↗</span></button>
   <button class="jump" data-jump="library">媒体列表 <span aria-hidden="true">↗</span></button>
   <button class="jump" data-jump="detail">剧集详情 <span aria-hidden="true">↗</span></button>
   <button class="jump" data-jump="detail" data-item="ep1">单集续播 <span aria-hidden="true">↗</span></button>
   <button class="jump" data-jump="settings">连接设置 <span aria-hidden="true">↗</span></button>
  </nav>
 </aside>
 <div class="shell" aria-label="Jellyfin 手机界面">
  <header class="top"></header>
  <main></main>
  <nav class="bottom" aria-label="主导航"></nav>
  <dialog class="confirmDialog" id="settings-dialog" aria-labelledby="confirm-title">
   <form id="confirmation-form">
    <h2 id="confirm-title">确认保存设置</h2>
    <label class="field">确认密码<input name="confirmation" type="password" autocomplete="off" aria-describedby="confirm-error" autofocus></label>
    <p class="confirmError" id="confirm-error" aria-live="polite"></p>
    <div class="actions">
     <button class="secondary" id="cancel-settings" type="button">取消</button>
     <button class="primary" type="submit">确认保存</button>
    </div>
   </form>
  </dialog>
 </div>
</div>
<script>
(() => {

const catalog={
 detective:{name:"魅影神捕",type:"剧集",year:"2026",art:0,desc:"离奇旧案再现江城，神捕黎斯循着一具傀儡的来历追查，在迷雾里拼起多年未解的真相。"},
 forest:{name:"山野回声",type:"电影",year:"2025",art:1,length:6070,desc:"一位录音师走进久无人迹的山谷，想记录最后一段林间回声，却遇到一位等候多年的陌生人。"},
 neon:{name:"夜港来信",type:"剧集",year:"2026",art:2,desc:"一封寄错的信，让三位素不相识的人在夜港相遇。"},
 lighthouse:{name:"潮汐尽头",type:"电影",year:"2025",art:3,length:6180,desc:"暴风雨来临前，守塔人收到一段来自海上的旧录音。"},
 desert:{name:"穿过赤色山谷",type:"电影",year:"2024",art:4,length:6900,desc:"摄影师在荒漠中寻找失踪的同伴，一路沿着风留下的记号前行。"},
 palace:{name:"长夜未央",type:"剧集",year:"2025",art:5,desc:"宫城入夜之后，一桩无名旧案重新浮出水面。"},
 ep1:{name:"傀儡惊现，黎斯以身入局",type:"单集",parent:"detective",season:1,episode:1,art:0,length:2780,desc:"一具傀儡出现在案发现场，黎斯循线进入深巷。"},
 ep2:{name:"月下疑踪",type:"单集",parent:"detective",season:1,episode:2,art:0,length:2620,desc:"夜访旧巷未得实证，黎斯将目光转向城外。"},
 ep3:{name:"灯下旧案",type:"单集",parent:"detective",season:1,episode:3,art:0,length:2750,desc:"关于那封书信，一位故人知道更多。"},
 ep4:{name:"雨夜归来",type:"单集",parent:"detective",season:2,episode:1,art:0,length:2650,desc:"一场大雨让江城旧案重现。"},
 n2:{name:"雨停之前",type:"单集",parent:"neon",season:1,episode:2,art:2,length:2500,desc:"港口停电前，三人交换了彼此知道的线索。"},
 n3:{name:"来自旧码头的电话",type:"单集",parent:"neon",season:1,episode:3,art:2,length:2450,desc:"一个电话把线索带回废弃的旧码头。"},
 p2:{name:"孤灯与故人",type:"单集",parent:"palace",season:1,episode:2,art:5,length:2550,desc:"归来的访客知道一段未经记载的往事。"}
};
const tiles=["detective","forest","neon","lighthouse","desert","palace"];
const mediaLibraries=[
 {id:"movies",name:"电影",items:["forest","lighthouse"]},
 {id:"series",name:"电视剧",items:["detective","neon","palace"]},
 {id:"favorites",name:"自建片库",items:["desert"]}
];
const latest=["lighthouse","palace","desert","neon","forest","detective"];
const next=["n3","p2","ep2"];
const records={ep1:1961,forest:1098,lighthouse:314,n2:2500};
// Jellyfin Web v10.11.11 playback settings use width and bits per second.
const resolutions=[["0","自动"],["-1","屏幕分辨率"],["640","360p"],["852","480p"],
 ["1280","720p"],["1920","1080p"],["3840","4K"],["7680","8K"]];
const bitrates=[["0","自动"],
 ...[120,80,60,40,20,15,10,8,6,4,3,1.5].map(value=>[String(value*1_000_000),value+" Mbps"]),
 ["720000","720 kbps"],["420000","420 kbps"]];
const settingsConfirmation="jellyfin";
const initialSettings={host:"proxy.example.net",port:"8080",proxyUser:"family",proxyPass:"prototype",server:"https://media.example.net/jellyfin",user:"家庭账号",pass:"prototype",resolution:"1920",bitrate:"4000000"};
let saved={...initialSettings};
let pendingSettings=null;
let current={page:"home"};
const stack=[];
let playTime=0, playing=false, timer=null, playerKey="";
const main=document.querySelector("main"), top=document.querySelector(".top"), bottom=document.querySelector(".bottom");
const settingsDialog=document.querySelector("#settings-dialog");
const confirmationForm=document.querySelector("#confirmation-form");
const confirmation=confirmationForm.elements.confirmation;
const confirmationError=document.querySelector("#confirm-error");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kind={home:"首页",library:"媒体库",detail:"媒体详情",settings:"连接设置",search:"搜索",player:"正在播放"};
const art=n=>'<span class="art a'+n+'" aria-hidden="true"></span>';
const time=n=>{const secs=Math.max(0,Math.floor(Number(n)||0)), s=String(secs%60).padStart(2,"0"), m=Math.floor(secs/60),h=Math.floor(m/60);return h?h+":"+String(m%60).padStart(2,"0")+":"+s:m+":"+s};
const parentName=i=>i.parent?catalog[i.parent].name:i.name;
const epLabel=i=>i.parent?"第 "+i.season+" 季 · 第 "+i.episode+" 集":"";
const isWatched=id=>catalog[id].length>0&&records[id]>=catalog[id].length;
const watchedBadge='<span class="watched"><span aria-hidden="true">✓</span>已看完</span>';
const ratio=id=>Math.min(100,Math.max(0,(records[id]||0)/(catalog[id].length||1)*100));
const progress=id=>'<span class="progress" aria-label="已看 '+Math.round(ratio(id))+'%"><i style="width:'+ratio(id)+'%"></i></span>';
const openButton=(label,data,cls="secondary")=>'<button class="'+cls+'" '+data+'>'+esc(label)+'</button>';
function leavePlayer(){
 if(!playerKey)return;
 if(playTime>0)records[playerKey]=Math.min(playTime,catalog[playerKey].length);
 clearInterval(timer);timer=null;playing=false;playerKey="";
}
function navigate(page, opts={}, replace=false){
 if(current.page==="player")leavePlayer();
 if(replace){stack.length=0;}else{stack.push({...current,scroll:main.scrollTop});}
 current={page,...opts}; render();
}
function back(){
 if(current.page==="player")leavePlayer();
 current=stack.pop()||{page:"home"};render();main.scrollTop=current.scroll||0;
}
function section(title,markup){
 return '<section class="group"><div class="section"><h2>'+title+'</h2></div>'+markup+'</section>';
}
function card(id,mode="poster"){
 const i=catalog[id], resume=mode==="resume", episode=Boolean(i.parent);
 const landscape=resume||mode==="next-up";
 const name=episode?parentName(i):i.name;
 const detail=episode?epLabel(i)+(resume?"":" · "+i.name):i.type+" · "+i.year;
 const watchTime=resume?'<span class="sub watchTime">'+time(records[id])+" / "+time(i.length)+'</span>':"";
 return '<button class="card" data-detail="'+id+'">'+
 '<span class="cover '+(landscape?"landscape":"")+'">'+art(i.art)+(resume?'<span class="resumeShade"></span><span class="resumeMark" aria-hidden="true">▶</span>'+progress(id):"")+'</span>'+
 '<span class="name">'+esc(name)+'</span><span class="sub">'+esc(detail)+'</span>'+watchTime+'</button>';
}
function rail(ids,mode){
 return '<div class="rail '+(mode||"poster")+'" tabindex="0">'+ids.map(id=>card(id,mode)).join("")+'</div>';
}
function home(){
 const resumed=Object.keys(records).filter(id=>records[id]>0&&records[id]<catalog[id].length);
 return section("继续观看",resumed.length?rail(resumed,"resume"):'<div class="empty">暂无未看完的影片。</div>')+
 section("接下来",rail(next.filter(id=>!resumed.includes(id)&&!isWatched(id)),"next-up"))+
 section("最近添加",rail(latest));
}
function library(){
 const selected=current.filter||"all", libraries=[{id:"all",name:"全部",items:tiles},...mediaLibraries];
 const matches=libraries.find(library=>library.id===selected).items;
 return '<div class="filters" aria-label="媒体库">'+libraries.map(({id,name})=>'<button class="chip" data-filter="'+id+'" aria-pressed="'+(id===selected)+'">'+esc(name)+'</button>').join("")+
 '</div><div class="grid">'+matches.map(id=>card(id)).join("")+'</div>';
}
function detail(){
 const id=current.id||"ep1",i=catalog[id],watched=isWatched(id),resume=watched?0:(records[id]||0);
 const meta=i.parent?epLabel(i)+" · "+Math.round(i.length/60)+" 分钟":i.year+" · "+i.type+(i.length?" · "+Math.round(i.length/60)+" 分钟":"");
 let buttons="", episodes="";
 if(i.type==="剧集"){
  const ids=Object.keys(catalog).filter(k=>catalog[k].parent===id), seasons=[...new Set(ids.map(k=>catalog[k].season))];
  const sel=current.season||seasons[0];
  const list=ids.filter(k=>catalog[k].season===sel).map(k=>{
   const episode=catalog[k], done=isWatched(k);
   return '<button class="episode" data-detail="'+k+'"><span class="cover landscape">'+art(episode.art)+'</span>'+
    '<span class="episodeInfo"><span class="name">第 '+episode.episode+' 集 · '+episode.name+'</span>'+
    '<span class="sub">'+Math.round(episode.length/60)+' 分钟'+(records[k]&&!done?' · 已看到 '+time(records[k]):"")+'</span></span>'+
    (done?watchedBadge:"")+'</button>';
  }).join("");
  const tabs=seasons.length>1?'<div class="seasonTabs" role="tablist" aria-label="选择季">'+
   seasons.map(n=>'<button class="chip" id="season-tab-'+n+'" role="tab" data-season="'+n+'" aria-controls="episodes-panel" aria-selected="'+(n===sel)+'" tabindex="'+(n===sel?0:-1)+'">第 '+n+' 季</button>').join("")+
   '</div>':"";
  episodes=section("选集",tabs+(tabs?'<div id="episodes-panel" role="tabpanel" aria-labelledby="season-tab-'+sel+'">'+list+'</div>':list));
 }else{
  buttons='<div class="actions">'+openButton(watched?"▶　重播":resume?"▶　继续观看":"▶　播放",'data-play="'+id+'" data-position="'+resume+'"',"primary")+
      (resume?openButton("从头播放",'data-play="'+id+'" data-position="0"'):"")+'</div>';
 }
 return '<div class="heroCover">'+art(i.art)+'<span class="shade" aria-hidden="true"></span></div><div class="sheet detail"><h1>'+esc(parentName(i))+'</h1><p class="meta">'+esc(meta)+(watched?watchedBadge:"")+'</p>'+
 (i.parent?'<h2 class="episodeTitle">'+esc(i.name)+'</h2>':"")+buttons+
 (resume?'<div class="watchprogress">'+progress(id)+'</div><small>已观看 '+time(resume)+' / '+time(i.length)+'</small>':"")+
 '<p class="summary">'+esc(i.desc)+'</p>'+episodes+'</div>';
}
function settings(){
 const fields=(name,key,type="text")=>'<label class="field">'+name+'<input name="'+key+'" type="'+type+'" value="'+esc(saved[key])+'" required autocomplete="off"></label>';
 const choices=(name,key,values)=>'<label class="field">'+name+'<select name="'+key+'">'+
 values.map(([value,label])=>'<option value="'+value+'" '+(value===saved[key]?"selected":"")+'>'+label+'</option>').join("")+'</select></label>';
 return '<div class="settings"><form id="settings"><section class="settingsGroup"><h2>家庭 HTTP 代理</h2><div class="columns">'+fields("代理地址","host")+fields("端口","port","number")+
 '</div>'+fields("代理用户名","proxyUser")+fields("代理密码","proxyPass","password")+'</section>'+
 '<section class="settingsGroup"><h2>Jellyfin 授权</h2>'+fields("服务器地址","server","url")+fields("Jellyfin 账号","user")+fields("Jellyfin 密码","pass","password")+'</section>'+
 '<section class="settingsGroup"><h2>播放画质</h2><div class="qualityFields">'+choices("分辨率上限","resolution",resolutions)+
 choices("码率上限（音视频合计）","bitrate",bitrates)+'</div></section>'+
 '<div class="settingsFooter"><button class="primary full" type="submit">保存并连接</button><div class="helper" id="settings-message" aria-live="polite"></div></div></form></div>';
}
function searchResults(term){
 const q=term.trim().toLowerCase();
 const ids=tiles.filter(id=>!q||catalog[id].name.toLowerCase().includes(q));
 return ids.length?'<div class="grid">'+ids.map(id=>card(id)).join("")+'</div>':'<p class="empty">没有找到匹配的影片。</p>';
}
function player(){
 const id=current.id,i=catalog[id];
 const resolution=resolutions.find(([value])=>value===saved.resolution)[1];
 const bitrate=bitrates.find(([value])=>value===saved.bitrate)[1];
 return '<div class="heroCover playerCover">'+art(i.art)+'<span class="shade"></span></div><h2 style="margin-top:16px">'+esc(parentName(i))+'</h2>'+
 '<p class="sub">'+esc(i.parent?epLabel(i)+" · "+i.name:"")+'</p>'+
 '<p class="helper">播放上限 · '+esc(resolution)+'／'+esc(bitrate)+'</p><div class="playerbar">'+
 '<button class="secondary" data-toggle-player>'+(!playing?"播放":"暂停")+'</button><input type="range" id="seek" min="0" max="'+i.length+'" value="'+playTime+'" aria-label="播放进度"><span class="sub" id="times">'+time(playTime)+' / '+time(i.length)+'</span></div>'+
 '<div style="margin-top:15px">'+openButton("返回详情","data-back")+'</div>';
}
function render(){
 const {page}=current, onHome=page==="home";
 main.dataset.screen=page;
 top.innerHTML='<div class="brand">'+(onHome?'<span class="mark" aria-hidden="true"></span>Jellyfin':'<button class="icon" data-back aria-label="返回">‹</button><span class="toplabel">'+esc(kind[page])+'</span>')+'</div>'+
 (page!=="player"?'<div class="tools"><button class="icon search" data-go="search" aria-label="搜索"></button><button class="icon" data-go="settings" aria-label="连接设置">⚙</button></div>':"");
 const tab=page==="settings"?"settings":page==="library"?"library":"home";
 bottom.innerHTML=[["home","⌂","首页"],["library","▤","媒体库"],["settings","⚙","设置"]].map(([p,icon,name])=>'<button data-tab="'+p+'" aria-current="'+(p===tab?"page":"false")+'"><span aria-hidden="true">'+icon+'</span>'+name+'</button>').join("");
 const contents={home,library,detail,settings,search:()=>'<div class="screenSearch"><input class="searchField" id="search-input" type="search" placeholder="搜索片名" aria-label="搜索片名" value="'+esc(current.query||"")+'"></div><div id="results">'+searchResults(current.query||"")+'</div>',player};
 main.className=page==="detail"?"":"pad";
 main.innerHTML=contents[page]();
 if(page==="library")main.querySelector(".filters").scrollLeft=current.filterScroll||0;
 main.scrollTop=0;
 document.querySelectorAll("[data-jump]").forEach(button=>{
  const selected=button.dataset.jump===page&&(page!=="detail"||(button.dataset.item||"detective")===current.id);
  button.setAttribute("aria-current",selected?"page":"false");
 });
}
function showPlayer(id,position){
 navigate("player",{id});
 playerKey=id;playTime=position;playing=true;render();
 timer=setInterval(()=>{
  if(!playing||!playerKey)return;
  const max=catalog[playerKey].length;
  playTime=Math.min(playTime+1,max);
  if(playTime===max){playing=false;const b=document.querySelector("[data-toggle-player]");if(b)b.textContent="播放";}
  updateTime();
 },1000);
}
function updateTime(){
 const times=document.querySelector("#times"), seek=document.querySelector("#seek");
 if(times&&seek&&playerKey){times.textContent=time(playTime)+" / "+time(catalog[playerKey].length);seek.value=playTime;}
}
function switchSeason(tab){
 const seasons=tab.closest(".seasonTabs");
 const scroll=main.scrollTop, left=seasons.scrollLeft;
 current.season=Number(tab.dataset.season);
 render();
 main.scrollTop=scroll;
 const selected=main.querySelector('[data-season="'+current.season+'"]');
 const row=selected.closest(".seasonTabs");
 row.scrollLeft=left;
 const bounds=row.getBoundingClientRect(), item=selected.getBoundingClientRect();
 if(item.left<bounds.left)row.scrollLeft+=item.left-bounds.left-4;
 if(item.right>bounds.right)row.scrollLeft+=item.right-bounds.right+4;
 selected.focus({preventScroll:true});
}
document.addEventListener("click",e=>{
 const button=e.target.closest("button");if(!button)return;
 const d=button.dataset;
 if("back" in d)back();
 else if(d.jump)navigate(d.jump,d.jump==="detail"?{id:d.item||"detective"}:{},true);
 else if(d.tab)navigate(d.tab,{},true);
 else if(d.go)navigate(d.go);
 else if(d.filter){current.filter=d.filter;current.filterScroll=button.closest(".filters").scrollLeft;render();}
 else if(d.season&&button.getAttribute("aria-selected")!=="true")switchSeason(button);
 else if(d.detail)navigate("detail",{id:d.detail});
 else if(d.play)showPlayer(d.play,Number(d.position));
 else if("togglePlayer" in d){playing=!playing;button.textContent=playing?"暂停":"播放";}
});
document.addEventListener("input",e=>{
 if(e.target.id==="search-input"){
  current.query=e.target.value;
  document.querySelector("#results").innerHTML=searchResults(current.query);
 }
 if(e.target.id==="seek"&&playerKey){playTime=Number(e.target.value);updateTime();}
});
document.addEventListener("submit",e=>{
 if(e.target.id!=="settings")return;
 e.preventDefault();
 const data=Object.fromEntries(new FormData(e.target));
 const helper=e.target.querySelector(".helper");
 if(Number(data.port)<1||Number(data.port)>65535){helper.textContent="请输入 1 到 65535 之间的代理端口。";return;}
 pendingSettings=data;
 const shell=document.querySelector(".shell").getBoundingClientRect();
 settingsDialog.style.setProperty("--dialog-center",shell.left+shell.width/2+"px");
 settingsDialog.showModal();
 confirmation.focus();
});
confirmationForm.addEventListener("submit",e=>{
 e.preventDefault();
 if(!pendingSettings)return;
 if(confirmation.value!==settingsConfirmation){
  confirmationError.textContent=confirmation.value?"确认密码错误，请重新输入。":"请输入确认密码。";
  confirmation.setAttribute("aria-invalid","true");
  confirmation.focus();
  return;
 }
 saved=pendingSettings;
 document.querySelector("#settings-message").textContent="示例设置已保存。";
 settingsDialog.close();
});
document.querySelector("#cancel-settings").addEventListener("click",()=>settingsDialog.close());
settingsDialog.addEventListener("close",()=>{
 pendingSettings=null;
 confirmation.value="";
 confirmation.removeAttribute("aria-invalid");
 confirmationError.textContent="";
});
document.addEventListener("keydown",e=>{
 if(settingsDialog.open)return;
 if(e.key==="Escape"&&stack.length){back();return;}
 if(!e.target.matches("[data-season]"))return;
 const tabs=[...e.target.closest(".seasonTabs").querySelectorAll("[data-season]")];
 const index=tabs.indexOf(e.target);
 const step={ArrowLeft:(index-1+tabs.length)%tabs.length,ArrowRight:(index+1)%tabs.length,Home:0,End:tabs.length-1};
 if(Object.hasOwn(step,e.key)){e.preventDefault();switchSeason(tabs[step[e.key]]);}
});
render();
})();
</script>
</body>
</html>
